name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUTOFF_PUBLIC_TEXAS: ${{ github.workspace }}/texas-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MaxGhenis/texas-governor-data-center-forecasts
          path: texas-public
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv venv --python 3.13 && uv pip install -e '.[dev]'
      - name: Registered files match the stamped list
        run: |
          if [ -f prereg/registration/SHA256SUMS ]; then
            shasum -a 256 -c prereg/registration/SHA256SUMS
          else
            echo "no registration yet"
          fi
      - name: Tests
        run: .venv/bin/pytest -n 4
      - name: Rebuild the ten Opus evidence files and their prompts, and check every hash
        env:
          CUTOFF_PRIVATE: ${{ runner.temp }}/private
          CUTOFF_SANDBOX: ${{ runner.temp }}/sandbox
        run: .venv/bin/cutoff build --check
