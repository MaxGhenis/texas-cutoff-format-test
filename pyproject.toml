[project]
name = "texas-cutoff-format-test"
version = "0.1.0"
description = "Does asking about one vote share at a time, instead of all six at once, change AI forecasters' jumps at the cutoff? A registered test on the 2026 Texas governor's race"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "hypothesis>=6.100"]

[project.scripts]
cutoff = "cutoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
